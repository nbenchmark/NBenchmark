name: Deploy Documentation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy docs from"
        required: false
        default: "main"
        type: string

jobs:
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Checkout docs.nbenchmark.net repo
        uses: actions/checkout@v7
        with:
          repository: nbenchmark/docs.nbenchmark.net
          token: ${{ secrets.DOCS_NBENCHMARK_NET_TOKEN }}
          path: ./docs-nbenchmark-net

      - name: Deploy to docs.nbenchmark.net
        run: |
          mkdir -p ./docs-nbenchmark-net/docs
          # Clear the published docs tree, but keep docs/studio (owned by the
          # NBenchmark.Studio repo's docs workflow) and any dotfiles such as
          # docs/.vitepress, which holds the site's SSG config.
          find ./docs-nbenchmark-net/docs -mindepth 1 -maxdepth 1 \
            ! -name studio ! -name '.*' -exec rm -rf {} +
          cp -r ./docs/* ./docs-nbenchmark-net/docs/

          cd ./docs-nbenchmark-net
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update documentation from NBenchmark"
            git push origin main
          fi