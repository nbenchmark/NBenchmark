name: CI Build

on:
  push:
    branches:
      - "**"

jobs:
  build:
    # NBenchmark carries more platform-conditional code than most libraries - thread affinity,
    # process priority, core topology and the macOS quality-of-service call each have their own
    # path, and the tests branch on the operating system rather than skipping. A single-OS run
    # leaves two thirds of that untested, for a library whose whole claim is accurate measurement.
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Without a ceiling a wedged worker pipe sits on GitHub's 360-minute default, which is six
    # hours of a runner to learn one test hung. Ubuntu and macOS finish inside ten minutes and
    # Windows inside forty once the framework fan-out and Defender are dealt with, so this is a
    # stuck-job guard with a wide margin, not a budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three-framework sweep runs once, on the fastest runner. What the other two rows
          # exist for is the platform-conditional code - thread affinity, process priority, core
          # topology, the macOS quality-of-service call - and none of that varies by target
          # framework, so running them against net10.0 alone loses no coverage. It does remove two
          # thirds of the isolation suite's process launches, which is where the Windows job's time
          # actually goes: the tests in NBenchmark.Tests that spawn a `dotnet exec` measurement
          # worker cost a process start each, and process creation is the one operation where
          # Windows is not within a small constant of Linux.
          #
          # Windows also skips the isolation tests that assert platform-neutral logic rather than
          # the worker protocol itself - roughly 150 spawning tests, over half the suite's wall
          # clock. See tests/NBenchmark.Tests/Workers/IsolationTraits.cs for where the line is and
          # why. The protocol tests it keeps are the ones that would actually catch a Windows bug:
          # pipe buffering, handle inheritance, exit codes, muxer resolution.
          - os: ubuntu-latest
            test-frameworks: ""
            test-filter: ""
          - os: windows-latest
            test-frameworks: "--framework net10.0"
            test-filter: '--filter "Isolation!=Semantics"'
          - os: macos-latest
            test-frameworks: "--framework net10.0"
            test-filter: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Defender scans every newly launched image and its dependency closure, which on this repo
      # means it re-inspects the worker's framework closure on each of ~770 `dotnet exec` starts on
      # a 4-vCPU VM. Excluding the workspace and the SDK is the difference between seconds and
      # minutes per launch. The runner account is an administrator, so this needs no elevation.
      - name: Exclude the build tree from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.nuget"
          Add-MpPreference -ExclusionPath "$env:ProgramFiles\dotnet"
          Add-MpPreference -ExclusionProcess "dotnet.exe"
          Add-MpPreference -ExclusionProcess "MSBuild.exe"
          Add-MpPreference -ExclusionProcess "VBCSCompiler.exe"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      # The TRX is the record of where the time went. A job that has to be killed leaves no summary
      # at all, and "Windows is slow" is not a finding you can act on without per-test durations.
      # No LogFileName: eight test assemblies share one results directory, and a fixed name means
      # each one overwrites the last, leaving a single project's timings to show for the run.
      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          ${{ matrix.test-frameworks }}
          ${{ matrix.test-filter }}
          --logger trx
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

  samples:
    # Every sample, built and *run*. Building them is already covered by the job above - they are in
    # the solution - so what this adds is that they still work: a sample is the shortest path from
    # the README to a wrong impression, and one that throws on startup after an API change looks
    # exactly like one that does not until something executes it. `samples/CrossClassSignificance`
    # spent an epoch outside the solution for want of a step like this.
    #
    # Ubuntu only, and after the build job. The samples measure real code, so the wall-clock cost is
    # the point of the exercise rather than something to pay three times over; the
    # platform-conditional code they would exercise is already covered by the matrix above.
    name: Run Samples
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build samples
        run: dotnet build --configuration Release

      - name: Run every sample
        run: |
          set -euo pipefail
          failed=()
          for project in samples/*/*.csproj; do
            name=$(basename "$(dirname "$project")")

            # A multi-targeted sample - the multi-runtime ones, and Telemetry - refuses to run
            # without a framework, so pick the newest it builds for. The point of those samples is
            # what they measure across runtimes, which they do by launching the others themselves.
            framework=()
            if grep -q "<TargetFrameworks>" "$project"; then
              framework=(--framework net10.0)
            fi

            echo "::group::$name"
            # A stuck-sample guard, not a budget. The slowest sample is a multi-runtime one, which
            # builds and launches a worker per runtime before it measures anything and still lands
            # under a minute; the whole set runs in about six.
            if timeout 900 dotnet run --project "$project" "${framework[@]}" --configuration Release --no-build; then
              echo "$name ok"
            else
              echo "$name FAILED with exit code $?"
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Samples that did not complete: ${failed[*]}"
            exit 1
          fi

  aot-probe:
    # What a consumer gets when they publish NBenchmark with Native AOT, checked in as a fact rather
    # than guessed at. The publish is the first half - every reflective member is declared, so an
    # undeclared trim or AOT hazard fails it - and running the binary is the half that matters: an
    # AOT compilation that succeeds and then throws at the first MakeGenericMethod is
    # indistinguishable from success until something executes it.
    #
    # See tests/NBenchmark.AotProbe/Program.cs for what the exit code means. It is currently a
    # refusal, deliberately: single mode is not AOT-viable yet, and this is where that stops being
    # folklore.
    name: Native AOT Probe
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish the probe with Native AOT
        run: dotnet publish tests/NBenchmark.AotProbe --configuration Release --output ./artifacts/aot

      - name: Run the published binary
        env:
          # The probe asks for Isolation.Off, so the "no worker deployed" notice is expected and
          # says nothing about the AOT question being asked.
          NBENCHMARK_SUPPRESS_ISOLATION_WARNING: "1"
        run: ./artifacts/aot/NBenchmark.AotProbe
