name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-pack:
    name: Build and Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ github.ref }}"
          VERSION="${VERSION#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack NuGet packages
        run: |
          mkdir -p ./artifacts/packages
          find src -maxdepth 2 -name "*.csproj" | while read csproj; do
            echo "Packing: $csproj"
            dotnet pack "$csproj" --no-build --configuration Release --output ./artifacts/packages -p:Version=${{ steps.version.outputs.version }}
          done

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages/*.nupkg
          retention-days: 30

      - name: Upload symbols as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-symbols
          path: ./artifacts/packages/*.snupkg
          retention-days: 30

  publish-nuget:
    name: Publish to NuGet
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment:
      name: nuget-release

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts/packages

      - name: Download symbols
        uses: actions/download-artifact@v8
        with:
          name: nuget-symbols
          path: ./artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get NuGet API key via trusted publishing (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: nbenchmark

      - name: Publish packages to NuGet
        run: |
          find ./artifacts/packages -name "*.nupkg" -not -name "*.symbols.nupkg" | while read pkg; do
            echo "Publishing: $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate \
              --no-symbols
          done

      - name: Publish symbols to NuGet
        run: |
          find ./artifacts/packages -name "*.snupkg" | while read pkg; do
            echo "Publishing symbols: $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  create-release:
    name: Create GitHub Release
    needs: publish-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  deploy-docs:
    name: Deploy Documentation
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout nbenchmark.net repo
        uses: actions/checkout@v6
        with:
          repository: nbenchmark/nbenchmark.net
          token: ${{ secrets.NBENCHMARK_NET_TOKEN }}
          path: ./nbenchmark-net

      - name: Deploy to nbenchmark.net
        run: |
          mkdir -p ./nbenchmark-net/docs
          rm -rf ./nbenchmark-net/docs/*
          cp -r ./docs/* ./nbenchmark-net/docs/

          cd ./nbenchmark-net
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update documentation from NBenchmark release ${{ github.ref }}"
            git push origin main
          fi
