version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore: "
      prefix-development: "chore(dev): "
      include: "scope"

    # A version floor the worker hands out to loaded targets, not a dependency it consumes - see
    # the comment at the bottom of src/NBenchmark.Worker/NBenchmark.Worker.csproj. It moves when
    # the OpenTelemetry SDK's own floor moves, which is a deliberate decision, not a patch bump.
    ignore:
      - dependency-name: "System.Diagnostics.DiagnosticSource"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore: "
      include: "scope"
